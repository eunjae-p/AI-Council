<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Council</title>
<style>
:root{
  --bg:#0a0e1a; --side:#0e1424; --panel:#121a2e; --panel2:#0d1528; --line:#223052; --line2:#2d3d63;
  --text:#e9efff; --muted:#8e9bba; --dim:#64708f;
  --user:#2a3b66; --gpt:#5ab0ff; --claude:#f2a65a; --council:#5ee0a0; --danger:#ff7d8c; --warn:#ffd166;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--text);background:#1c2742}
button:hover{background:#25335a} button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--council);color:#06131a;font-weight:700} button.primary:hover{filter:brightness(1.08)}
button.primary.stop{background:var(--danger);color:#1a0509}
button.danger{color:var(--danger)} button.ghost{background:transparent} button.ghost:hover{background:#1a2440}
button.small{padding:4px 9px;font-size:12.5px;border-radius:7px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gpt);box-shadow:0 0 0 3px #5ab0ff22}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.brand h1{margin:0;font-size:18px;letter-spacing:-.02em} .brand span{color:var(--dim);font-size:12px}
.side .top{padding:0 12px 10px;display:grid;gap:8px}
.side .top input{padding:8px 11px;width:100%}
.tabs{display:flex;gap:4px;padding:0 12px 8px} .tabs button{flex:1;font-size:13px;padding:6px 0;background:transparent;color:var(--muted)}
.tabs button.on{background:#1c2742;color:var(--text)}
.list{flex:1;overflow:auto;padding:0 8px 10px;min-height:0}
.item{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;background:transparent;margin:1px 0}
.item:hover{background:#151f38} .item.on{background:#1d2a4b;box-shadow:inset 3px 0 0 var(--council)}
.item .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item .s{display:block;color:var(--dim);font-size:12px}
.item mark{background:#5ab0ff33;color:var(--text);border-radius:3px;padding:0 1px}
.item .row{display:flex;gap:6px;margin-top:6px}
.group{color:var(--dim);font-size:11.5px;letter-spacing:.06em;padding:10px 10px 4px}
.side .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}
.upbar{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upbar .new{color:var(--council);font-weight:700;cursor:pointer;text-decoration:underline dotted}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;width:min(560px,100%);max-height:80vh;overflow:auto;box-shadow:0 20px 60px #0008}
.modal h3{margin:0 0 10px;font-size:16px} .modal pre{white-space:pre-wrap;background:#0b1326;border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.55 ui-monospace,Consolas,monospace;margin:8px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.side .foot .cli{flex:1;line-height:1.5} .side .foot .cli b{font-weight:600;color:var(--muted)}
.upd{display:block;margin-top:2px;color:var(--warn);cursor:pointer;text-decoration:underline dotted} .upd:hover{color:#ffe3a3}
.empty-list{color:var(--dim);font-size:13px;padding:14px 10px}

/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:58px}
.bar .menu{display:none}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.title h2{margin:0;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.title input{flex:1;padding:6px 10px;font-size:15px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.arch{color:var(--warn);border-color:#6b5a2a}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.notice{margin:10px 18px 0;padding:9px 12px;border-radius:10px;font-size:13.5px;border:1px solid var(--line2);background:#111a30}
.notice summary{cursor:pointer;color:var(--muted)} .notice .body{white-space:pre-wrap;margin-top:8px;font-size:13.5px;color:#cfd8ee}
.notice.err{border-color:#6b2c39;color:#ffc2ca}
.thread{flex:1;overflow:auto;padding:18px 18px 28px;min-height:0;scroll-behavior:smooth}
.inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.welcome{color:var(--muted);text-align:center;margin-top:12vh}
.welcome h3{color:var(--text);font-size:20px;margin:0 0 6px}

.msg{border-radius:14px;padding:12px 15px;border:1px solid var(--line);background:var(--panel)}
.msg.user{align-self:flex-end;max-width:min(78%,720px);background:var(--user);border-color:#3a5089}
.msg .head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:6px}
.msg .who{font-weight:800;letter-spacing:.03em}
.msg .head .sp{flex:1}
.msg.gpt{border-left:3px solid var(--gpt)} .msg.gpt .who{color:var(--gpt)}
.msg.claude{border-left:3px solid var(--claude)} .msg.claude .who{color:var(--claude)}
.msg.council{border:1px solid #2f6b55;background:linear-gradient(160deg,#10261f,#121a2e 60%)} .msg.council .who{color:var(--council)}
.msg.user .who{color:#b9c9f3}
.msg.error{border-color:#6b2c39;background:#2a121a;color:#ffc2ca;font-size:13.5px} .msg.error .who{color:var(--danger)}
.msg.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:none}}
.content{white-space:pre-wrap;word-break:break-word}
.content pre{white-space:pre;overflow:auto;background:#070b15;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0;font:13px/1.5 ui-monospace,Consolas,monospace}
.content code{font:13px ui-monospace,Consolas,monospace;background:#070b15;border-radius:5px;padding:1px 5px}
.content pre code{background:none;padding:0}
.content .h{font-weight:800;display:block;margin-top:4px}
details.indiv{border:1px dashed var(--line2);border-radius:12px;padding:6px 10px}
details.indiv>summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px}
details.indiv .msg{margin-top:10px}
.pending{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 14px;border:1px dashed var(--line2);border-radius:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #ffffff22;border-top-color:var(--council);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inline-err{border:1px solid #6b2c39;background:#2a121a;color:#ffc2ca;border-radius:12px;padding:10px 14px;white-space:pre-wrap;font-size:13.5px}
.inline-warn{border:1px solid #6b5a2a;background:#2a2412;color:#ffe3a3;border-radius:12px;padding:10px 14px;white-space:pre-wrap;font-size:13.5px}

/* composer */
.composer{border-top:1px solid var(--line);padding:12px 18px 14px;background:#0b111f}
.composer .inner{gap:8px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg button{background:transparent;padding:5px 12px;font-size:13.5px;color:var(--muted);border-radius:7px}
.seg button.on[data-v=gpt]{background:#16304d;color:var(--gpt)}
.seg button.on[data-v=claude]{background:#3a2a17;color:var(--claude)}
.seg button.on[data-v=both]{background:#12352a;color:var(--council)}
.seg button.on[data-m]{background:#1d2a4b;color:var(--text)}
.workdir{display:none;flex:1;min-width:220px;padding:6px 10px;font-size:13.5px} .workdir.show{display:block}
.badge{font-size:11px;border:1px solid #6b5a2a;color:var(--warn);border-radius:6px;padding:0 6px}
.models{display:none;gap:8px;flex-wrap:wrap} .models.open{display:flex}
.models label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}
.models select,.models input{padding:6px 9px;font-size:13.5px}
.custom{display:none}
.write{display:flex;gap:8px;align-items:flex-end}
.composer.drag{outline:2px dashed var(--gpt);outline-offset:-6px;background:#0e1a30}
.chips{display:flex;gap:6px;flex-wrap:wrap} .chips:empty{display:none}
.chip2 img.thumb{width:28px;height:28px;object-fit:cover;border-radius:5px;margin-left:-4px}
.attnote{font-size:11.5px;color:var(--warn)}
.media{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px} .media img{height:110px;max-width:220px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);cursor:zoom-in;background:#000}
.media.frames img{height:64px;max-width:114px} .media .t{font-size:10.5px;color:var(--dim);text-align:center}
.chip2{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:#16223d;border:1px solid var(--line2);border-radius:8px;padding:3px 6px 3px 9px}
.chip2 .x{background:none;padding:0 4px;color:var(--muted)} .chip2 .k{color:var(--council);font-size:11px}
.atts{margin-top:8px;display:flex;flex-direction:column;gap:4px} .atts details{font-size:13px} .atts summary{cursor:pointer;color:#c7d3f5}
.atts pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#0b1326;border:1px solid var(--line);border-radius:8px;padding:8px;font:12.5px/1.5 ui-monospace,Consolas,monospace;margin:6px 0 0}
.write textarea{flex:1;resize:none;min-height:48px;max-height:40vh;padding:12px 14px;line-height:1.55}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:18px}
.status .r{margin-left:auto;color:var(--dim)}
.toast{position:fixed;right:18px;top:68px;display:grid;gap:8px;z-index:20}
.toast div{background:#1c2742;border:1px solid var(--line2);padding:9px 13px;border-radius:10px;font-size:13.5px;max-width:420px;box-shadow:0 10px 30px #0006}
.toast div.err{border-color:#6b2c39;color:#ffc2ca}
.scrim{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:10;transform:translateX(-105%);transition:transform .2s}
  .app.nav .side{transform:none} .app.nav .scrim{display:block;position:fixed;inset:0;background:#0008;z-index:9}
  .bar .menu{display:inline-block} .bar{padding:10px 12px} .thread{padding:14px 12px} .composer{padding:10px 12px}
  .acts .lbl{display:none} .msg.user{max-width:92%}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><h1>AI Council</h1><span id="ver">V0.6</span></div>
    <div class="top">
      <button class="primary" id="newBtn">＋ 새 대화</button>
      <input id="search" type="search" placeholder="모든 대화 검색…" autocomplete="off">
    </div>
    <div class="tabs" id="tabs">
      <button data-scope="all" class="on">대화</button>
      <button data-scope="archived">보관함</button>
      <button data-scope="trash">휴지통</button>
    </div>
    <div class="list" id="list"></div>
    <div class="upbar" id="upbar"><span id="appVer">Council</span><span class="upd" id="upCheck">업데이트 확인</span><span class="new" id="upNew" hidden></span></div>
    <div class="foot"><span class="cli" id="cli">CLI 확인 중…</span><button class="small" id="quit">앱 종료</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="bar">
      <button class="ghost menu" id="menu" aria-label="대화 목록">☰</button>
      <div class="title" id="titleBox"><h2 id="title" title="클릭해서 제목 변경">새 대화</h2><span class="chip" id="count"></span><span class="chip arch" id="archChip" hidden>보관됨</span></div>
      <div class="acts">
        <button class="ghost small" id="renameBtn">✎ <span class="lbl">제목</span></button>
        <button class="ghost small" id="archiveBtn">⇩ <span class="lbl">보관</span></button>
        <button class="ghost small" id="exportBtn">⤓ <span class="lbl">Markdown</span></button>
        <button class="ghost small danger" id="deleteBtn">🗑 <span class="lbl">삭제</span></button>
      </div>
    </div>
    <div id="notices"></div>
    <div class="thread" id="thread"><div class="inner" id="msgs"></div></div>

    <div class="composer">
      <div class="inner">
        <div class="ctl">
          <div class="seg" id="mode" title="대화: 도구·파일 접근 없이 빠르게 답변 / 작업: 지정한 폴더의 파일을 읽으며 답변">
            <button data-m="chat" class="on">💬 대화</button><button data-m="work">🛠 작업</button>
          </div>
          <div class="seg" id="target">
            <button data-v="gpt">GPT</button><button data-v="claude">Claude</button><button data-v="both" class="on">둘 다 + 최종 결론</button>
          </div>
          <button class="ghost small" id="modelToggle">모델 설정 ▾</button>
          <span class="status" id="modelInfo"></span>
          <input class="workdir" id="workdir" placeholder="작업 폴더 (예: D:\ComfyUI\user\default\workflows) — 읽기 전용">
        </div>
        <div class="models" id="models">
          <label>GPT 모델 (Codex CLI)
            <select id="gptModel">
              <option value="account default">계정 기본값</option>
              <optgroup label="계정에서 지원될 때만 동작">
              <option value="gpt-6.1-sol">GPT-6.1 Sol</option>
              <option value="gpt-6-sol">GPT-6 Sol</option>
              <option value="gpt-6-luna">GPT-6 Luna</option>
              <option value="gpt-6-astra">GPT-6 Astra</option>
              </optgroup>
              <option value="custom">직접 입력…</option>
            </select>
            <input class="custom" id="gptCustom" placeholder="예: gpt-6.1-sol">
          </label>
          <label>Claude 모델 (Claude Code CLI)
            <select id="claudeModel">
              <option value="account default">계정 기본값</option>
              <optgroup label="최신 버전 자동 추적">
                <option value="opus">Opus 최신</option><option value="sonnet">Sonnet 최신</option><option value="fable">Fable 최신</option>
              </optgroup>
              <optgroup label="버전 고정">
                <option value="claude-opus-5-5">Claude Opus 5.5</option>
                <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
                <option value="claude-fable-5-1">Claude Fable 5.1</option>
                <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
              </optgroup>
              <option value="custom">직접 입력…</option>
            </select>
            <input class="custom" id="claudeCustom" placeholder="예: claude-opus-5-5">
          </label>
        </div>
        <div class="chips" id="chips"></div>
        <div class="attnote" id="attachNote" hidden></div>
        <div class="write">
          <button class="ghost" id="attachBtn" title="파일 첨부 (JSON·이미지·영상 · 끌어다 놓기·Ctrl+V 가능)">📎</button>
          <input type="file" id="fileInput" multiple hidden accept=".json,.txt,.md,.py,.yaml,.yml,.csv,.tsv,.toml,.ini,.cfg,.log,.js,.ts,.html,.css,.xml,.ps1,.bat,.cmd,.sh,image/*,video/*,.mov,.mkv">
          <textarea id="q" rows="2" placeholder="질문을 입력하세요 · 📎·끌어다 놓기·Ctrl+V로 JSON·이미지·영상 첨부 (Enter 보내기 · Shift+Enter 줄바꿈)"></textarea>
          <button class="primary" id="send">보내기</button>
        </div>
        <div class="status"><span id="spin" class="spin" hidden></span><span id="status">준비됨</span><span class="r" id="ctxInfo"></span></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const UI_VERSION = '0.9.3'; // ai_council_web.py 의 VERSION 과 같아야 함
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const S = { files:[], mode:'chat', scope:'all', list:[], current:null, meta:null, items:[], running:null, target:'both', searchTimer:null };

// ---------- API ----------
async function api(path, body) {
  const opt = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) };
  const res = await fetch(path, opt);
  let data = {};
  try { data = await res.json(); } catch { throw new Error(`서버 응답을 읽을 수 없습니다 (${res.status})`); }
  if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
  return data;
}
function toast(text, err) { const t = el('div', err ? 'err' : '', text); $('#toast').append(t); setTimeout(() => t.remove(), err ? 7000 : 3200); }
function fmt(ts) { if (!ts) return ''; const d = new Date(ts * 1000), n = new Date();
  const p = x => String(x).padStart(2,'0');
  return (d.toDateString() === n.toDateString() ? '' : `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `) + `${p(d.getHours())}:${p(d.getMinutes())}`; }

// ---------- 간단한 Markdown 표시 (안전: textContent만 사용) ----------
function renderText(container, text) {
  const parts = String(text).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2) { const pre = el('pre'); const code = el('code'); code.textContent = part.replace(/^[\w+-]*\n/, ''); pre.append(code); container.append(pre); return; }
    part.split('\n').forEach((line, li, arr) => {
      const m = line.match(/^\s{0,3}#{1,6}\s+(.*)$/);
      if (m) { container.append(el('span', 'h', m[1])); return; }
      line.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach(tok => {
        if (/^`[^`]+`$/.test(tok)) container.append(el('code', '', tok.slice(1, -1)));
        else if (/^\*\*[^*]+\*\*$/.test(tok)) container.append(el('b', '', tok.slice(2, -2)));
        else if (tok) container.append(document.createTextNode(tok));
      });
      if (li < arr.length - 1) container.append(document.createTextNode('\n'));
    });
  });
}

// ---------- 메시지 ----------
const KIND = { user:'user', GPT:'gpt', Claude:'claude', Council:'council', '오류':'error' };
const LABEL = { user:'나', GPT:'GPT', Claude:'Claude', Council:'Council 최종 결론', '오류':'오류 기록 · 모델에는 전달되지 않음' };
function who(item) { return item.role === 'user' ? 'user' : (item.model || 'assistant'); }
function msgEl(item, index) {
  const w = who(item), box = el('article', 'msg ' + (KIND[w] || ''));
  if (index != null) box.dataset.index = index;
  const head = el('div', 'head');
  head.append(el('span', 'who', LABEL[w] || w));
  if (item.mode === 'work') head.append(el('span', 'badge', '작업' + (item.workdir ? ' · ' + item.workdir : '')));
  if (item.cli_model) head.append(el('span', '', item.cli_model));
  if (item.elapsed) head.append(el('span', '', `${item.elapsed}s`));
  head.append(el('span', 'sp'), el('span', '', fmt(item.time)));
  if (w !== 'user') { const c = el('button', 'ghost small', '복사'); c.onclick = () => copyText(item.content); head.append(c); }
  const body = el('div', 'content'); renderText(body, item.content);
  box.append(head, body);
  if (item.attachments && item.attachments.length) {
    const a = el('div', 'atts');
    item.attachments.forEach(att => {
      if (att.kind === 'image' || att.kind === 'video') {
        a.append(el('div', '', `${att.kind === 'video' ? '🎬' : '🖼'} ${att.name} · ${fmtSize(att.size || 0)}` + (att.error ? ' · 분석 준비 실패' : '')));

  node.append(document.createTextNode(text.slice(i)));

// ---------- 모델 선택 ----------
function modelValue(sel, custom) { return sel.value === 'custom' ? custom.value.trim() : sel.value; }
function bindModel(sel, custom, key) {
  const saved = store.get(key);
  if (saved) { if ([...sel.options].some(o => o.value === saved)) sel.value = saved; else { sel.value = 'custom'; custom.value = saved; } }
  const sync = () => { custom.style.display = sel.value === 'custom' ? 'block' : 'none'; updateModelInfo(); };
  sel.onchange = () => { sync(); if (sel.value === 'custom') custom.focus(); else store.set(key, sel.value); };
  custom.oninput = () => { store.set(key, custom.value.trim()); updateModelInfo(); };
  sync();
}
function updateModelInfo() {
  const g = modelValue($('#gptModel'), $('#gptCustom')) || '?', c = modelValue($('#claudeModel'), $('#claudeCustom')) || '?';
  const short = v => v === 'account default' ? '기본' : v;
  $('#modelInfo').textContent = S.target === 'gpt' ? `GPT: ${short(g)}` : S.target === 'claude' ? `Claude: ${short(c)}` : `GPT: ${short(g)} · Claude: ${short(c)}`;
}

// ---------- 보내기 ----------
function setBusy(on, text) {
  S.running = on ? S.current : null;
  const b = $('#send'); b.disabled = false; b.classList.toggle('stop', on);
  b.textContent = on ? '■ 중지' : '보내기'; b.title = on ? '답변 생성 중지 (Esc)' : '';
  $('#spin').hidden = !on; $('#status').textContent = text || (on ? '진행 중' : '준비됨');
}
function pendingEl(text) { const p = el('div', 'pending'); p.id = 'pending'; p.append(el('span', 'spin'), el('span', 'ptext', text)); return p; }

async function send() {
  const q = $('#q'), question = q.value.trim();
  if ((!question && !S.files.length) || S.running) return;
  if (S.files.some(f => f.uploading)) { toast('파일 업로드가 끝난 뒤 보내 주세요', true); return; }
  if (S.files.some(f => f.failed)) { toast('업로드에 실패한 첨부를 지운 뒤 보내 주세요', true); return; }
  if (S.files.some(f => f.conv && f.conv !== S.current)) { toast('다른 대화에서 올린 이미지·영상은 그 대화에서만 보낼 수 있습니다. 다시 첨부해 주세요', true); return; }
  const gpt = modelValue($('#gptModel'), $('#gptCustom')), claude = modelValue($('#claudeModel'), $('#claudeCustom'));
  if (S.target !== 'claude' && !gpt) { $('#models').classList.add('open'); $('#gptCustom').focus(); return; }
  if (S.target !== 'gpt' && !claude) { $('#models').classList.add('open'); $('#claudeCustom').focus(); return; }
  if (S.mode === 'work' && !$('#workdir').value.trim()) { $('#workdir').focus(); toast('작업 모드에서는 작업 폴더를 입력하세요', true); return; }
  if (!S.current) await newConversation();
  const convId = S.current, box = $('#msgs');
  setBusy(true, '보내는 중');
  if (!S.items.length) box.innerHTML = '';
  const pend = pendingEl('대화 맥락을 준비하는 중'); box.append(pend); scrollBottom();
  const draft = question; q.value = ''; autoGrow();
  const sentFiles = S.files.slice(); S.files = []; renderChips();
  if (sentFiles.length) { const t = pend.querySelector('.ptext'); if (t) t.textContent = '첨부 파일을 보내는 중'; }
  const here = () => S.current === convId;
  let gotUser = false, wasStopped = false;
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question, conversation_id:convId, target:S.target, gpt_model:gpt, claude_model:claude, mode:S.mode, workdir:$('#workdir').value.trim(), attachments: sentFiles.map(f => f.upload ? ({ name:f.name, upload:f.upload }) : ({ name:f.name, content:f.content })) }) });
    if (!res.ok) { let m = '요청 실패'; try { m = (await res.json()).error || m; } catch {} throw new Error(m); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true }); const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line) continue; const e = JSON.parse(line);
        if (e.type === 'stage') { $('#status').textContent = e.text; const t = pend.querySelector('.ptext'); if (t) t.textContent = e.text; }
        else if (e.type === 'saved') { gotUser = true; if (here()) { pend.before(msgEl(e.item)); }
          const c = e.context; $('#ctxInfo').textContent = c ? `모델에 전달: ${c.summarized_through ? `요약(1-${c.summarized_through}) + ` : ''}최근 ${c.total - c.recent_from}개 메시지` : ''; }
        else if (e.type === 'answer') { if (here()) { pend.before(msgEl(e.item)); scrollBottom(); } }
        else if (e.type === 'summary') { if (here()) pend.before(el('div', 'inline-warn', e.text)); }
        else if (e.type === 'warning') { if (here()) pend.before(el('div', 'inline-warn', e.text)); }
        else if (e.type === 'stopped') { wasStopped = true; if (here()) pend.before(el('div', 'inline-warn', e.text)); }
        else if (e.type === 'model_error') { if (here()) pend.before(el('div', 'inline-err', `${e.model} 오류\n${e.text}`)); }
        else if (e.type === 'error') { throw new Error(e.text); }
        else if (e.type === 'done') { if (e.errors && Object.keys(e.errors).length) toast('일부 모델 호출이 실패했습니다', true); }
      }
    }
    pend.remove();
    if (here()) await openConversation(convId);
    $('#status').textContent = wasStopped ? '중지됨' : '답변 완료';
  } catch (err) {
    pend.remove();
    if (!gotUser && !q.value) { q.value = draft; autoGrow(); }
    if (!gotUser && !S.files.length) { S.files = sentFiles; renderChips(); } // 저장 전 실패면 첨부도 되돌림 // 질문이 저장되지 않았으면 입력창에 되돌림
    if (here()) { try { await openConversation(convId); } catch {} const last = S.items[S.items.length - 1];
      if (!last || last.role !== 'error') { $('#msgs').append(el('div', 'inline-err', '오류: ' + err.message)); } scrollBottom(); }
    else toast('오류: ' + err.message, true);
    $('#status').textContent = '오류로 중단됨';
  } finally {
    setBusy(false, $('#status').textContent); $('#send').disabled = false;
    loadList().catch(() => {});
  }
}
$('#send').onclick = () => S.running ? stopRun() : send();
async function stopRun() {

      outdated.push(k);
      const u = el('span', 'upd', `${x.latest} 업데이트 있음 · 명령 복사`); u.title = x.update_command;
      u.onclick = async () => { try { await navigator.clipboard.writeText(x.update_command); toast(`복사됨: ${x.update_command}\n터미널에 붙여넣어 실행한 뒤 AI Council을 다시 시작하세요.`); } catch { toast(x.update_command); } };
      box.append(u);
    }
  }
  if (S.ffmpeg === false) { const f = el('span', 'upd', 'ffmpeg 없음 · 영상 분석 불가'); f.style.color = 'var(--warn)'; f.title = 'Setup.cmd를 실행해 설치한 뒤 Council을 다시 시작하세요';
    f.onclick = () => modal('ffmpeg 설치', 'Council 폴더의 Setup.cmd를 실행하면 ffmpeg가 설치됩니다.\n설치 후 Council을 다시 시작하세요.\n\n직접 설치: winget install Gyan.FFmpeg'); box.append(f); }
  const r = el('span', 'upd', '버전 다시 확인'); r.style.color = 'var(--dim)'; r.onclick = () => loadVersions(true); box.append(r);
  if (outdated.length && !force) toast('CLI 업데이트 또는 로그인이 필요합니다. 왼쪽 아래 안내를 확인하세요.', true);
}

// ---------- 첨부 (텍스트·JSON / 이미지·영상) ----------
const MAX_FILES = 5, MAX_FILE_BYTES = 2 * 1024 * 1024, MAX_IMAGE_BYTES = 20 * 1024 * 1024, MAX_VIDEO_BYTES = 2 * 1024 * 1024 * 1024;
const OK_EXT = /\.(json|txt|md|py|ya?ml|csv|tsv|toml|ini|cfg|log|js|ts|html|css|xml|ps1|bat|cmd|sh)$/i;
const IMG_EXT = /\.(png|jpe?g|webp|gif|bmp)$/i, VID_EXT = /\.(mp4|mov|mkv|avi|webm|m4v|mpe?g|wmv)$/i;
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
function renderChips() {
  const box = $('#chips'); box.innerHTML = '';
  S.files.forEach((f, i) => {
    const c = el('span', 'chip2');
    if (f.thumb) { const im = el('img', 'thumb'); im.src = f.thumb; c.append(im); }
    c.append(el('span', '', (f.kind === 'video' ? '🎬 ' : f.kind === 'image' ? '🖼 ' : '📎 ') + f.name),
      el('span', 'k', f.uploading ? `업로드 ${f.progress || 0}%` : f.failed ? '실패' : fmtSize(f.size)));
    const x = el('button', 'x', '×'); x.title = '첨부 취소';
    x.onclick = () => { if (f.xhr) f.xhr.abort(); S.files.splice(i, 1); renderChips(); };
    c.append(x); box.append(c);
  });
  const media = S.files.some(f => f.kind === 'image' || f.kind === 'video');
  $('#attachNote').hidden = !S.files.length;
  $('#attachNote').textContent = '첨부 내용은 질문과 함께 OpenAI·Anthropic 서버로 전송됩니다.' + (media ? ' 영상은 프레임 이미지로 나눠 분석하며 소리는 분석하지 않습니다.' : '');
}
function uploadMedia(f, file) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest(); f.xhr = xhr; f.uploading = true; f.progress = 0;
    xhr.open('POST', `/api/upload?conversation_id=${encodeURIComponent(f.conv)}&name=${encodeURIComponent(file.name)}`);
    xhr.upload.onprogress = e => { if (e.lengthComputable) { f.progress = Math.round(e.loaded / e.total * 100); renderChips(); } };
    xhr.onload = () => {
      f.uploading = false; f.xhr = null;
      let r = {}; try { r = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200 && r.id) { f.upload = r.id; } else { f.failed = true; toast(`${file.name}: ${r.error || '업로드 실패'}`, true); }
      renderChips(); resolve();
    };
    xhr.onerror = xhr.onabort = () => { f.uploading = false; f.failed = true; f.xhr = null; renderChips(); resolve(); };
    xhr.send(file);
  });
}
async function addFiles(list) {
  const files = [...list];
  if (!files.length) return;
  for (const file of files) {
    if (S.files.length >= MAX_FILES) { toast(`첨부는 ${MAX_FILES}개까지 가능합니다`, true); break; }
    const name = file.name || `붙여넣은_이미지_${Date.now()}.png`;
    if (IMG_EXT.test(name) || VID_EXT.test(name) || (!file.name && /^image\//.test(file.type))) {
      const kind = VID_EXT.test(name) ? 'video' : 'image';
      if (kind === 'video' && S.ffmpeg === false) { modal('영상을 분석할 수 없습니다', '이 PC에 ffmpeg가 없습니다.\n\nCouncil 폴더의 Setup.cmd를 실행해 ffmpeg를 설치한 뒤 Council을 다시 시작하세요.\n(이미지·텍스트 첨부는 지금도 가능합니다. 영상 대신 캡처 이미지를 붙여넣어도 됩니다.)'); continue; }
      if (file.size > (kind === 'image' ? MAX_IMAGE_BYTES : MAX_VIDEO_BYTES)) { toast(`${name}: ${kind === 'image' ? '이미지는 20MB' : '영상은 2GB'} 이하만 첨부할 수 있습니다`, true); continue; }
      if (!S.current) await newConversation();
      const f = { name, size:file.size, kind, conv:S.current, thumb: kind === 'image' ? URL.createObjectURL(file) : '' };
      S.files.push(f); renderChips();
      const named = file.name ? file : new File([file], name, { type:file.type });
      uploadMedia(f, named);
      continue;
    }
    if (!OK_EXT.test(name)) { toast(`${name}: JSON·텍스트·이미지·영상 파일만 첨부할 수 있습니다`, true); continue; }
    if (file.size > MAX_FILE_BYTES) { toast(`${name}: 2MB 이하만 첨부할 수 있습니다`, true); continue; }
    try { S.files.push({ name, size:file.size, kind:'text', content: await file.text() }); }
    catch { toast(`${name}: 파일을 읽지 못했습니다`, true); }
  }
  renderChips(); $('#q').focus();
}
$('#attachBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
(() => {
  const zone = document.querySelector('.composer'); let depth = 0;
  const has = e => [...(e.dataTransfer && e.dataTransfer.types || [])].includes('Files');
  zone.addEventListener('dragenter', e => { if (!has(e)) return; e.preventDefault(); depth++; zone.classList.add('drag'); });
  zone.addEventListener('dragover', e => { if (has(e)) e.preventDefault(); });
  zone.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) zone.classList.remove('drag'); });
  zone.addEventListener('drop', e => { if (!has(e)) return; e.preventDefault(); depth = 0; zone.classList.remove('drag'); addFiles(e.dataTransfer.files); });
  // 화면 다른 곳에 떨어뜨려도 브라우저가 파일을 열어버리지 않게
  window.addEventListener('dragover', e => { if (has(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (has(e)) { e.preventDefault(); if (!zone.contains(e.target)) addFiles(e.dataTransfer.files); } });
  // Ctrl+V: 캡처 이미지나 탐색기에서 복사한 파일을 붙여넣으면 첨부, 글자는 원래대로 붙여넣기
  document.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    let files = [...(cd.files || [])];
    if (!files.length) files = [...(cd.items || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
})();
function attUrl(att, path) {
  const p = String(path || '').replace(/\\/g, '/'), key = '/attachments/' + S.current + '/';
  const i = p.indexOf(key);
  return i < 0 ? '' : `/api/attachment?conversation_id=${encodeURIComponent(S.current)}&file=${encodeURIComponent(p.slice(i + key.length))}`;
}

// ---------- Council 자체 업데이트 (GitHub → 이 PC) ----------
function modal(title, body, buttons) {
  const m = el('div', 'modal'), box = el('div', 'box'); box.append(el('h3', '', title));
  if (body) box.append(typeof body === 'string' ? el('pre', '', body) : body);
  const row = el('div', 'row');
  (buttons || [{ label:'닫기' }]).forEach(b => { const btn = el('button', b.primary ? 'primary' : '', b.label);
    btn.onclick = () => { if (!b.keep) m.remove(); b.onClick && b.onClick(); }; row.append(btn); });
  box.append(row); m.append(box); m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.append(m); return m;
}
async function checkUpdate(force, quiet) {
  if (!quiet) { $('#upCheck').textContent = '확인 중…'; }
  let r; try { r = await api('/api/update/check' + (force ? '?refresh=1' : '')); }
  catch (e) { if (!quiet) toast('업데이트 확인 실패: ' + e.message, true); return; }
  finally { $('#upCheck').textContent = '업데이트 확인'; }
  const n = $('#upNew');
  if (r.status === 'available') {
    n.hidden = false; n.textContent = `새 버전${r.remote ? ' V' + r.remote : ''} 있음`;
    n.onclick = () => showUpdate(r);
    if (!quiet) showUpdate(r);
  } else {
    n.hidden = true;
    if (!quiet) modal(r.status === 'latest' ? '최신 버전입니다' : '업데이트를 확인할 수 없습니다',
      r.status === 'latest' ? `현재 V${r.running} · GitHub 최신 상태와 같습니다.` : r.message);
  }
}
function showUpdate(r) {
  const body = `현재 V${r.running} → 새 V${r.remote || '?'}  (변경 ${r.behind}개)\n\n` +
    (r.commits && r.commits.length ? r.commits.map(c => '• ' + c).join('\n') : '변경 내역 없음 (기록 정리만 필요)') +
    '\n\n대화 기록(data/)은 그대로 유지됩니다. 업데이트 후 Council이 새 창으로 다시 시작됩니다.';
  modal('Council 업데이트', body, [{ label:'나중에' }, { label:'지금 업데이트', primary:true, onClick: applyUpdate }]);
}
async function applyUpdate() {
  if (S.running) { toast('답변 생성 중에는 업데이트할 수 없습니다', true); return; }
  const m = modal('업데이트 중…', 'GitHub에서 새 버전을 받는 중입니다.', [{ label:'닫기', keep:true }]);
  let r; try { r = await api('/api/update/apply', {}); }
  catch (e) { m.remove(); modal('업데이트를 멈췄습니다', e.message); return; }
  if (!r.restarting) { m.remove(); modal('최신 버전입니다', `현재 V${r.version}`); $('#upNew').hidden = true; return; }
  m.querySelector('pre').textContent = `V${r.version} 받기 완료 (${r.from} → ${r.to}).\nCouncil을 다시 시작하는 중… 잠시 후 화면이 새로고침됩니다.\n(새 콘솔 창이 열리고 이전 창은 닫힙니다)`;
  const started = Date.now();
  const poll = async () => {
    try { const s = await api('/api/status'); if (s.version === r.version) { location.reload(); return; } } catch {}
    if (Date.now() - started > 90000) { m.querySelector('pre').textContent = '재시작 확인이 늦어지고 있습니다. AI-Council_Web.cmd 를 직접 실행한 뒤 새로고침하세요.'; return; }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 2500);
}
$('#upCheck').onclick = () => checkUpdate(true, false);

// ---------- 기타 ----------
$('#newBtn').onclick = () => newConversation().catch(e => toast(e.message, true));
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setScope(b.dataset.scope));
$('#search').addEventListener('input', () => { clearTimeout(S.searchTimer); S.searchTimer = setTimeout(() => doSearch().catch(e => toast(e.message, true)), 250); });
$('#menu').onclick = () => $('#app').classList.toggle('nav'); $('#scrim').onclick = () => $('#app').classList.remove('nav');
$('#quit').onclick = async () => { if (S.running && !confirm('답변 생성 중입니다. 그래도 종료할까요?')) return;
  try { await fetch('/api/shutdown', { method:'POST' }); } finally { document.body.innerHTML = '<div style="padding:40px;font:16px system-ui;color:#e9efff;background:#0a0e1a;height:100vh">AI Council을 종료했습니다. 이 창을 닫아도 됩니다.</div>'; } };
window.addEventListener('beforeunload', e => { if (S.running) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { const id = (location.hash.match(/^#c=([\w-]+)/) || [])[1]; if (id && id !== S.current) openConversation(id).catch(() => {}); });

(async function init() {
  bindModel($('#gptModel'), $('#gptCustom'), 'councilGptModel');
  bindModel($('#claudeModel'), $('#claudeCustom'), 'councilClaudeModel');
  $('#workdir').value = store.get('councilWorkdir') || '';
  setMode('chat'); // 기본값은 항상 대화 모드
  setTarget(['gpt','claude','both'].includes(store.get('councilTarget')) ? store.get('councilTarget') : 'both');
  api('/api/status').then(s => { $('#ver').textContent = 'V' + s.version;
    if (s.version !== UI_VERSION) { const n = el('div', 'notice err', `서버(V${s.version})가 화면(V${UI_VERSION})보다 오래된 버전입니다. AI Council 콘솔 창을 닫고 AI-Council_Web.cmd 를 다시 실행하세요.`); $('#notices').before(n); }
    const mark = ok => ok ? '●' : '○'; $('#cli').textContent = `${mark(s.cli.codex)} Codex  ${mark(s.cli.claude)} Claude`;
    $('#cli').title = 'CLI 감지 여부 (PATH 기준)'; if (!s.cli.codex || !s.cli.claude) toast('일부 CLI를 찾지 못했습니다. PATH를 확인하세요.', true);
    S.ffmpeg = s.ffmpeg;
    loadVersions(false);
    $('#appVer').textContent = 'Council V' + s.version;
    checkUpdate(false, true);
  }).catch(() => { $('#cli').textContent = '서버 연결 실패'; });
  try {
    await loadList();
    const want = (location.hash.match(/^#c=([\w-]+)/) || [])[1] || store.get('councilConversation');
    const found = S.list.find(x => x.id === want);
    if (found) await openConversation(found.id);
    else { const first = S.list.find(x => !x.archived); if (first) await openConversation(first.id); else await newConversation(); }
  } catch (e) { toast('초기화 실패: ' + e.message, true); }
})();
</script>
