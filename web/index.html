<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Council</title>
<script>/* 화면 테마: 깜빡임 없이 처음부터 적용 (dark | light | system) */
try { const t = localStorage.getItem('councilTheme') || 'dark';
  document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
} catch (e) { document.documentElement.dataset.theme = 'dark'; }
/* 화면 언어: 저장된 선택 → 없으면 브라우저 언어 (한국어면 ko, 그 외 en) */
var LANG = (function () { var v = ''; try { v = localStorage.getItem('councilLang') || ''; } catch (e) {}
  if (v === 'ko' || v === 'en') return v; return /^ko/i.test(navigator.language || '') ? 'ko' : 'en'; })();
document.documentElement.lang = LANG;</script>
<style>
:root{
  --bg:#0a0e1a; --side:#0e1424; --panel:#121a2e; --panel2:#0d1528; --line:#223052; --line2:#2d3d63;
  --text:#e9efff; --muted:#8e9bba; --dim:#64708f;
  --user:#2a3b66; --gpt:#5ab0ff; --claude:#f2a65a; --council:#5ee0a0; --danger:#ff7d8c; --warn:#ffd166;
  --btn:#1c2742; --btn-h:#25335a; --chip-bg:#16223d; --claude-bg:#3a2a17; --code-bg:#070b15; --code-inline:#1a2340; --composer:#0b111f; --council-bg:#12352a; --council-grad:#10261f; --council-line:#2f6b55; --danger-bg:#3a1820; --err-bg:#2a121a; --err-line:#6b2c39; --err-text:#ffc2ca; --gpt-bg:#16304d; --hover:#151f38; --info-bg:#123247; --info-line:#2d6a8f; --info-text:#8fd3ff; --link:#8fc3ff; --neutral-bg:#2a2f40; --notice-bg:#111a30; --on-accent:#06131a; --on-danger:#1a0509; --row-alt:#0f1628; --sel:#1d2a4b; --spin-track:#ffffff22; --strong:#fff; --text-body:#dbe3f4; --th-bg:#16203a; --user-line:#3a5089; --user-who:#b9c9f3; --warn-bg:#2a2210; --warn-line:#6b5a1e; --warn-text:#ffe3a3;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#ffffff; --side:#f7f7f8; --panel:#ffffff; --panel2:#f5f6f8; --line:#e6e8ec; --line2:#d5d9e0;
  --text:#1f2328; --muted:#5b6475; --dim:#8a93a5;
  --user:#eef2fa; --gpt:#1a73e8; --claude:#c2621a; --council:#0f9d6b; --danger:#d03445; --warn:#b7791f;
  --btn:#eceef3; --btn-h:#e1e4eb; --chip-bg:#eef1f6; --claude-bg:#fbeee0; --code-bg:#f5f6f8; --code-inline:#eef0f4; --composer:#ffffff; --council-bg:#e0f4ea; --council-grad:#eaf7f1; --council-line:#bfe3d1; --danger-bg:#fdecee; --err-bg:#fdf0f1; --err-line:#f0c4ca; --err-text:#a1222f; --gpt-bg:#e3eefc; --hover:#f1f3f7; --info-bg:#e4f1fb; --info-line:#a8cdea; --info-text:#0b62a0; --link:#1a66cc; --neutral-bg:#eef0f4; --notice-bg:#f6f7f9; --on-accent:#ffffff; --on-danger:#ffffff; --row-alt:#fafbfc; --sel:#e8ecf4; --spin-track:#00000018; --strong:#0f1115; --text-body:#24292f; --th-bg:#f3f5f9; --user-line:#d5ddf0; --user-who:#4a5d8f; --warn-bg:#fff7e3; --warn-line:#e6d29c; --warn-text:#7a5410;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
button{font:inherit;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--text);background:var(--btn)}
button:hover{background:var(--btn-h)} button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--council);color:var(--on-accent);font-weight:700} button.primary:hover{filter:brightness(1.08)}
button.primary.stop{background:var(--danger);color:var(--on-danger)}
button.danger{color:var(--danger)} button.ghost{background:transparent} button.ghost:hover{background:var(--hover)}
button.small{padding:4px 9px;font-size:12.5px;border-radius:7px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gpt);box-shadow:0 0 0 3px #5ab0ff22}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}

/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.brand .bright{display:inline-flex;align-items:center;gap:6px} .themebtn{font-size:14px;padding:3px 7px;line-height:1}
.langbtn{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.brand h1{margin:0;font-size:18px;letter-spacing:-.02em;white-space:nowrap} .themebtn{white-space:nowrap} .brand span{color:var(--dim);font-size:12px}
.side .top{padding:0 12px 10px;display:grid;gap:8px}
.side .top input{padding:8px 11px;width:100%}
.tabs{display:flex;gap:4px;padding:0 12px 8px} .tabs button{flex:1;font-size:13px;padding:6px 0;background:transparent;color:var(--muted)}
.tabs button.on{background:var(--btn);color:var(--text)}
.list{flex:1;overflow:auto;padding:0 8px 10px;min-height:0}
.item{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;background:transparent;margin:1px 0}
.item:hover{background:var(--hover)} .item.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--council)}
.item .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item .s{display:block;color:var(--dim);font-size:12px}
.item mark{background:#5ab0ff33;color:var(--text);border-radius:3px;padding:0 1px}
.item .row{display:flex;gap:6px;margin-top:6px}
.item .hd{display:flex;align-items:center;gap:7px;min-width:0} .item .hd .t{flex:1;min-width:0}
.item .md{display:inline-flex;gap:2px;flex:none;color:var(--muted)} .item .md svg{width:15px;height:15px;display:block}
.item .md .work{color:var(--warn)}
.item .md .edit{color:var(--gpt)} .item .md .image{color:var(--council)}
.media.gen img{height:220px;max-width:100%} .saved{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)} .saved code{font:12px ui-monospace,Consolas,monospace}
#imgOpts select{background:transparent;border:0;color:var(--muted);font-size:13px;padding:2px 4px}
.item .ft{display:flex;align-items:center;gap:6px} .item .ft .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mb{display:inline-flex;gap:3px;flex:none}
.item .mb span{font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;letter-spacing:.2px}
.item .mb .g{color:var(--gpt);background:var(--gpt-bg)} .item .mb .c{color:var(--claude);background:var(--claude-bg)}
.group{color:var(--dim);font-size:11.5px;letter-spacing:.06em;padding:10px 10px 4px}
.side .foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}
.upbar{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upbar .appline{line-height:1.5} .upbar #appVer b{font-weight:600;color:var(--muted)}
.upbar #upErr{color:var(--dim)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px 20px;width:min(560px,100%);max-height:80vh;overflow:auto;box-shadow:0 20px 60px #0008}
.modal h3{margin:0 0 10px;font-size:16px} .modal pre{white-space:pre-wrap;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.55 ui-monospace,Consolas,monospace;margin:8px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.side .foot .cli{flex:1;line-height:1.5} .side .foot .cli b{font-weight:600;color:var(--muted)}
.side .foot .usage{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);color:var(--muted)}
.upd{display:block;margin-top:2px;color:var(--warn);cursor:pointer;text-decoration:underline dotted} .upd:hover{color:var(--warn-text)}
.empty-list{color:var(--dim);font-size:13px;padding:14px 10px}

/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);min-height:58px}
.bar .menu{display:none}
.title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.title h2{margin:0;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.title input{flex:1;padding:6px 10px;font-size:15px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.arch{color:var(--warn);border-color:var(--warn-line)}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.notice{margin:10px 18px 0;padding:9px 12px;border-radius:10px;font-size:13.5px;border:1px solid var(--line2);background:var(--notice-bg)}
.notice summary{cursor:pointer;color:var(--muted)} .notice .body{white-space:pre-wrap;margin-top:8px;font-size:13.5px;color:var(--text)}
.notice.err{border-color:var(--err-line);color:var(--err-text)}
.thread{flex:1;overflow:auto;padding:18px 18px 28px;min-height:0;scroll-behavior:smooth}
.inner{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.welcome{color:var(--muted);text-align:center;margin-top:12vh}
.welcome h3{color:var(--text);font-size:20px;margin:0 0 6px}

/* 답변은 ChatGPT·Claude 앱처럼 박스 없이 본문 위주로, 모델 색은 왼쪽 선과 이름으로만 구분 */
.msg{border-radius:14px;padding:14px 20px;border:1px solid var(--line);background:var(--panel)}
.msg.gpt,.msg.claude{background:transparent;border:0;border-radius:0;padding:2px 4px 2px 20px}
.msg.user{align-self:flex-end;max-width:min(80%,760px);background:var(--user);border-color:var(--user-line);border-radius:18px 18px 4px 18px}
.msg .head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:8px;flex-wrap:wrap}
.msg .who{font-weight:800;letter-spacing:.03em}
.msg .head .sp{flex:1}
.msg.gpt{border-left:3px solid var(--gpt)} .msg.gpt .who{color:var(--gpt)}
.msg.claude{border-left:3px solid var(--claude)} .msg.claude .who{color:var(--claude)}
.msg.council{border:1px solid var(--council-line);background:linear-gradient(160deg,var(--council-grad),var(--panel) 60%)} .msg.council .who{color:var(--council)}
.msg.user .who{color:var(--user-who)}
.msg.error{border-color:var(--err-line);background:var(--err-bg);color:var(--err-text);font-size:13.5px} .msg.error .who{color:var(--danger)}
.msg.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:none}}
/* ---- 답변 본문 (Markdown) ---- */
.content{font-size:15.5px;line-height:1.78;color:var(--text-body);word-break:break-word;overflow-wrap:anywhere}
.content>*:first-child{margin-top:0} .content>*:last-child{margin-bottom:0}
.content p{margin:0 0 .85em}
.content .mdh{color:var(--strong);font-weight:750;line-height:1.4;margin:1.35em 0 .5em;letter-spacing:-.01em}
.content .mdh1{font-size:1.38em} .content .mdh2{font-size:1.22em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.content .mdh3{font-size:1.1em} .content .mdh4,.content .mdh5,.content .mdh6{font-size:1em}
.content b,.content strong{color:var(--strong);font-weight:700}
.content em{color:var(--text)}
.content ul,.content ol{margin:.15em 0 .9em;padding-left:1.55em}
.content li{margin:.32em 0;padding-left:.15em} .content li>ul,.content li>ol{margin:.25em 0 .3em}
.content li::marker{color:var(--dim)} .content ol>li::marker{font-weight:600}
.content blockquote{margin:.6em 0 .9em;padding:.2em 0 .2em 14px;border-left:3px solid var(--line2);color:var(--muted)}
.content hr{border:0;border-top:1px solid var(--line2);margin:1.4em 0}
.content a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
.content .tbl{overflow-x:auto;margin:.5em 0 1em}
.content table{border-collapse:collapse;font-size:14px;line-height:1.55;min-width:50%}
.content th,.content td{border:1px solid var(--line2);padding:7px 11px;text-align:left;vertical-align:top}
.content th{background:var(--th-bg);color:var(--strong);font-weight:700} .content tr:nth-child(even) td{background:var(--row-alt)}
.content pre{white-space:pre;overflow:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:.4em 0 1em;font:13px/1.55 ui-monospace,Consolas,monospace}
.content code{font:.86em ui-monospace,Consolas,monospace;background:var(--code-inline);color:var(--text);border-radius:5px;padding:.1em .38em}
.content pre code{background:none;padding:0;font-size:13px;color:inherit}
.msg.user .content{font-size:15px;line-height:1.65;color:var(--text)}
.msg.error .content{font-size:13.5px;line-height:1.6;color:var(--err-text);white-space:pre-wrap}
details.indiv{border:1px dashed var(--line2);border-radius:12px;padding:6px 10px}
details.indiv>summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px}
details.indiv .msg{margin-top:10px}
.pending .ptime{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
.pendwrap .plog{margin:6px 2px 0;font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);max-height:260px;overflow:auto}
.act{display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .act .at{color:var(--dim);flex:none;min-width:34px} .act .aw{color:var(--council);flex:none}
.act .ax{overflow:hidden;text-overflow:ellipsis} .act.text .ax{color:var(--dim);font-family:system-ui,sans-serif} .act.init .ax{color:var(--info-text)}
details.actlog{margin-top:8px;font-size:12.5px} details.actlog summary{cursor:pointer;color:var(--muted)} details.actlog .act{font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--muted)}
.pending{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 14px;border:1px dashed var(--line2);border-radius:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--spin-track);border-top-color:var(--council);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inline-err{border:1px solid var(--err-line);background:var(--err-bg);color:var(--err-text);border-radius:12px;padding:10px 14px;white-space:pre-wrap;font-size:13.5px}
.inline-warn{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);border-radius:12px;padding:10px 14px;white-space:pre-wrap;font-size:13.5px}

/* composer */
.composer{border-top:1px solid var(--line);padding:12px 18px 14px;background:var(--composer)}
.composer .inner{gap:8px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px}
.seg button{background:transparent;padding:5px 12px;font-size:13.5px;color:var(--muted);border-radius:7px}
.seg button.on[data-v=gpt]{background:var(--gpt-bg);color:var(--gpt)}
.seg button.on[data-v=claude]{background:var(--claude-bg);color:var(--claude)}
.seg button.on[data-v=both]{background:var(--council-bg);color:var(--council)}
.warn-ico{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--warn);color:#1a1300;font-size:11px;font-weight:800;margin-left:3px;vertical-align:1px}
.tip{position:relative}
.tip:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:340px;white-space:pre-line;text-align:left;
  background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);font-size:12.5px;line-height:1.55;padding:10px 12px;border-radius:9px;box-shadow:0 8px 24px #0008;z-index:40;pointer-events:none}
.tip:hover::before{content:'';position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--warn-line);z-index:40}
.webtog{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px 11px;font-size:13px;color:var(--muted)}
.seg[hidden]{display:none} .mcpgrp{display:inline-flex;gap:2px} .webtog.gear{padding:6px 9px}
.editcard{border:1px solid var(--info-line);background:var(--info-bg);border-radius:12px;padding:12px 16px;font-size:13.5px}
.editcard .eh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap} .editcard .ew{color:var(--dim);font-size:12px}
.editcard .efiles{margin:8px 0;display:grid;gap:3px} .editcard .efiles code{font:12.5px ui-monospace,Consolas,monospace}
.editcard .fs{display:inline-block;min-width:52px;font-size:11px;padding:1px 6px;border-radius:5px;margin-right:8px;text-align:center}
.fs.new{background:var(--council-bg);color:var(--council)} .fs.modified{background:var(--gpt-bg);color:var(--gpt)} .fs.deleted{background:var(--danger-bg);color:var(--danger)}
.editcard pre.diff{white-space:pre;overflow:auto;max-height:420px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;margin:6px 0}
.diff .add{color:var(--council)} .diff .del{color:var(--danger)} .diff .hunk{color:var(--gpt)}
.editcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px} .editcard .ehint{color:var(--dim);font-size:12px}
.editcard .estate{margin-top:8px;font-weight:600} .estate.commit{color:var(--council)} .estate.revert{color:var(--muted)}
.mcpdeny{margin:8px 0 2px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:13px}
.mcpdeny b{color:var(--warn-text)} .mcpdeny .t{margin:6px 0 2px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.mcpdeny pre{white-space:pre-wrap;margin:2px 0 6px;color:var(--muted);font-size:12px;max-height:120px;overflow:auto}
.mcpdeny .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.kind{font-size:11px;padding:1px 6px;border-radius:5px;margin-left:6px} .kind.read{background:var(--council-bg);color:var(--council)}
.kind.action{background:var(--danger-bg);color:var(--danger)} .kind.unknown{background:var(--neutral-bg);color:var(--muted)}
.mcplist{max-height:50vh;overflow:auto;margin:8px 0} .mcplist .srv{margin:10px 0 4px;font-weight:600;color:var(--muted);font-size:12.5px}
.mcplist label{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:13px;font-family:ui-monospace,Consolas,monospace}
.webtog.on{background:var(--info-bg);border-color:var(--info-line);color:var(--info-text)}
.msg .badge.web{background:var(--info-bg);color:var(--info-text)}
.indiv .round{font-size:12px;color:var(--muted);margin:10px 4px 4px;font-weight:600}
.indiv .dlog{margin:6px 4px 2px}
.seg button.on[data-m],.seg button.on[data-x],.seg button.on[data-r]{background:var(--sel);color:var(--text)}
.workdir{display:none;flex:1;min-width:220px;padding:6px 10px;font-size:13.5px} .workdir.show{display:block}
.badge{font-size:11px;border:1px solid var(--warn-line);color:var(--warn);border-radius:6px;padding:0 6px}
.models{display:none;gap:8px;flex-wrap:wrap} .models.open{display:flex}
.models label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}
.models select,.models input{padding:6px 9px;font-size:13.5px}
.custom{display:none}
.write{display:flex;gap:8px;align-items:flex-end}
.composer.drag{outline:2px dashed var(--gpt);outline-offset:-6px;background:var(--hover)}
.chips{display:flex;gap:6px;flex-wrap:wrap} .chips:empty{display:none}
.chip2 img.thumb{width:28px;height:28px;object-fit:cover;border-radius:5px;margin-left:-4px}
.attnote{font-size:11.5px;color:var(--warn)}

<script>
const UI_VERSION = '0.18.0'; // ai_council_web.py 의 VERSION 과 같아야 함
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// 화면 문구: T('한국어', 'English') — 언어 전환은 저장 후 새로고침
const T = (ko, en) => LANG === 'en' ? en : ko;
function applyStaticLang() {
  if (LANG !== 'en') return;
  document.querySelectorAll('[data-en]').forEach(e => { e.textContent = e.dataset.en; });
  const attr = { enTitle:'title', enPlaceholder:'placeholder', enTip:'data-tip', enLabel:'label', enAria:'aria-label' };
  document.querySelectorAll('[data-en-title],[data-en-placeholder],[data-en-tip],[data-en-label],[data-en-aria]').forEach(e => {
    for (const [k, a] of Object.entries(attr)) if (e.dataset[k] != null) e.setAttribute(a, e.dataset[k]); });
}
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const S = { files:[], mode:'chat', scope:'all', list:[], current:null, meta:null, items:[], running:null, target:'both', searchTimer:null };

// ---------- API ----------
async function api(path, body) {
  const opt = body === undefined ? { headers:{ 'X-Lang':LANG } } : { method:'POST', headers:{'Content-Type':'application/json', 'X-Lang':LANG}, body:JSON.stringify(body) };
  const res = await fetch(path, opt);
  let data = {};
  try { data = await res.json(); } catch { throw new Error(T(`서버 응답을 읽을 수 없습니다 (${res.status})`, `Could not read the server response (${res.status})`)); }
  if (!res.ok) throw new Error(data.error || T(`요청 실패 (${res.status})`, `Request failed (${res.status})`));
  return data;
}
function toast(text, err) { const t = el('div', err ? 'err' : '', text); $('#toast').append(t); setTimeout(() => t.remove(), err ? 7000 : 3200); }
function fmt(ts) { if (!ts) return ''; const d = new Date(ts * 1000), n = new Date();
  const p = x => String(x).padStart(2,'0');
  return (d.toDateString() === n.toDateString() ? '' : `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `) + `${p(d.getHours())}:${p(d.getMinutes())}`; }

// ---------- 간단한 Markdown 표시 (안전: textContent만 사용) ----------
// ---------- Markdown 렌더링 (외부 라이브러리 없이, 내용은 항상 텍스트로만 넣어 안전) ----------
function renderInline(parent, text) {
  const re = /(`[^`\n]+`|\*\*(?=\S)[^\n]+?\*\*|__(?=\S)[^_\n]+?__|~~[^~\n]+~~|\[[^\]\n]+\]\(https?:\/\/[^)\s]+\)|https?:\/\/[^\s<>()\[\]]+[^\s<>()\[\].,;:!?'"]|(?<![\w*])\*(?=[^\s*])[^*\n]+?(?<=\S)\*(?![\w*]))/;
  let rest = String(text);
  while (rest) {
    const m = rest.match(re);
    if (!m) { parent.append(document.createTextNode(rest)); break; }
    if (m.index) parent.append(document.createTextNode(rest.slice(0, m.index)));
    const t = m[0];
    if (t[0] === '`') parent.append(el('code', '', t.slice(1, -1)));
    else if (t.startsWith('**') || t.startsWith('__')) { const b = el('strong'); renderInline(b, t.slice(2, -2)); parent.append(b); }
    else if (t.startsWith('~~')) { const d = el('del'); renderInline(d, t.slice(2, -2)); parent.append(d); }
    else if (t[0] === '[') { const k = t.indexOf(']('); const a = el('a', '', t.slice(1, k)); a.href = t.slice(k + 2, -1); a.target = '_blank'; a.rel = 'noopener noreferrer'; parent.append(a); }
    else if (t.startsWith('http')) { const a = el('a', '', t); a.href = t; a.target = '_blank'; a.rel = 'noopener noreferrer'; parent.append(a); }
    else { const i = el('em'); renderInline(i, t.slice(1, -1)); parent.append(i); }
    rest = rest.slice(m.index + t.length);
  }
}
function renderText(container, text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
  const LIST = /^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/;
  const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  let para = [];
  const flush = () => { if (!para.length) return; const p = el('p'); para.forEach((l, k) => { if (k) p.append(el('br')); renderInline(p, l.trim()); }); container.append(p); para = []; };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*(```|~~~)/);
    if (fence) {
      flush(); const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
      i++; const pre = el('pre'), code = el('code'); code.textContent = buf.join('\n'); pre.append(code); container.append(pre); continue;
    }
    if (!line.trim()) { flush(); i++; continue; }
    const h = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h) { flush(); const d = el('div', 'mdh mdh' + h[1].length); renderInline(d, h[2]); container.append(d); i++; continue; }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); container.append(el('hr')); i++; continue; }
    if (line.includes('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
      flush(); const wrap = el('div', 'tbl'), table = el('table'), thead = el('thead'), tr = el('tr');
      cells(line).forEach(c => { const th = el('th'); renderInline(th, c); tr.append(th); }); thead.append(tr); table.append(thead);
      const tbody = el('tbody'); i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) {

function renderThread() {

  let turn = [];
  const flush = () => { for (const key of ['mcp_denials', 'cmd_denials']) {
      const all = [], seen = new Set(), withD = turn.filter(x => (x[key] || []).length);
      withD.forEach(x => x[key].forEach(d => { const k = d.tool || d.command; if (!seen.has(k)) { seen.add(k); all.push(d); } }));
      turn.forEach(x => { delete x[key === 'mcp_denials' ? '_mcpAll' : '_cmdAll']; });
      if (withD.length) withD[withD.length - 1][key === 'mcp_denials' ? '_mcpAll' : '_cmdAll'] = all; }

  S.items.forEach(x => { if (x.role === 'user') flush(); else turn.push(x); }); flush();
  // 수정 결과 확정/되돌리기 기록 (ref → 기록)
  S.editDone = {}; S.items.forEach(x => { if (x.role === 'edit' && x.ref) S.editDone[x.ref] = x; });
  // 사용자 질문 하나 + 뒤따르는 답변들을 한 묶음으로 표시
  let i = 0;
  while (i < S.items.length) {
    const item = S.items[i];
    if (item.role === 'user') { box.append(msgEl(item, i)); i++; }
    const all = [];
    while (i < S.items.length && S.items[i].role !== 'user') { all.push([S.items[i], i]); i++; }
    // 파일 변경 기록·구현 답변은 토론 과정 밖, 결론 아래에 표시
    const edits = all.filter(([x]) => x.role === 'edit' && !x.ref), impl = all.filter(([x]) => x.round >= 3);
    const group = all.filter(([x]) => x.role !== 'edit' && !(x.round >= 3));
    const tail = () => { impl.forEach(([x, idx]) => box.append(msgEl(x, idx))); edits.forEach(([x]) => box.append(editCard(x))); };
    const council = group.find(([x]) => x.model === 'Council');

        if (rounds) {
          // 토론: 1차 의견(GPT·Claude) → 교차 검토(GPT·Claude) 순서로

          let last = 0;
          sorted.forEach(([x, idx]) => { if (x.round && x.round !== last) { last = x.round; d.append(el('div', 'round', x.round === 1 ? T('1라운드 · 서로 보지 않고 낸 독립 의견', 'Round 1 · independent answers') : T('2라운드 · 상대 답변을 읽고 쓴 교차 검토', "Round 2 · cross reviews of each other's answers"))); } d.append(msgEl(x, idx)); });
          if (council[0].debate_dir) {
            const b = el('button', 'ghost small dlog', T('📁 토론 기록 폴더 열기', '📁 Open discussion log folder'));
            b.onclick = async () => { try { const r = await api('/api/debate/open', { dir: council[0].debate_dir });
              if (!r.opened) { copyText(r.path); toast(T('폴더 경로를 복사했습니다: ', 'Folder path copied: ') + r.path); } } catch (e) { toast(e.message, true); } };
            d.append(b);
          }

          d.append(el('summary', '', T(`개별 답변 보기 (${rest.map(([x]) => x.model).join(' · ')})`, `Show individual answers (${rest.map(([x]) => x.model).join(' · ')})`)));
          rest.forEach(([x, idx]) => d.append(msgEl(x, idx)));
        }
        box.append(d);
      }
      tail();
    } else { group.forEach(([x, idx]) => box.append(msgEl(x, idx))); tail(); }
  }
}

function highlight(node, text, q) {

  node.append(document.createTextNode(text.slice(i)));

    xhr.send(file);

}
async function addFiles(list) {
  const files = [...list];
  if (!files.length) return;
  for (const file of files) {
    if (S.files.length >= MAX_FILES) { toast(T(`첨부는 ${MAX_FILES}개까지 가능합니다`, `Up to ${MAX_FILES} attachments`), true); break; }
    const name = file.name || `${T('붙여넣은_이미지', 'pasted_image')}_${Date.now()}.png`;
    if (IMG_EXT.test(name) || VID_EXT.test(name) || (!file.name && /^image\//.test(file.type))) {
      const kind = VID_EXT.test(name) ? 'video' : 'image';
      if (kind === 'video' && S.ffmpeg === false) { modal(T('영상을 분석할 수 없습니다', 'Cannot analyze video'), T(`이 PC에 ffmpeg가 없습니다.\n\nCouncil 폴더의 ${S.setup || 'Setup.cmd'}를 실행해 ffmpeg를 설치한 뒤 Council을 다시 시작하세요.\n(이미지·텍스트 첨부는 지금도 가능합니다. 영상 대신 캡처 이미지를 붙여넣어도 됩니다.)`, `ffmpeg is not installed on this computer.\n\nRun ${S.setup || 'Setup.cmd'} in the Council folder to install it, then restart Council.\n(Images and text work now. You can paste screenshots instead of a video.)`)); continue; }
      if (file.size > (kind === 'image' ? MAX_IMAGE_BYTES : MAX_VIDEO_BYTES)) { toast(`${name}: ` + (kind === 'image' ? T('이미지는 20MB 이하만 첨부할 수 있습니다', 'images must be 20MB or smaller') : T('영상은 2GB 이하만 첨부할 수 있습니다', 'videos must be 2GB or smaller')), true); continue; }
      if (!S.current) await newConversation();
      const f = { name, size:file.size, kind, conv:S.current, thumb: kind === 'image' ? URL.createObjectURL(file) : '' };
      S.files.push(f); renderChips();
      const named = file.name ? file : new File([file], name, { type:file.type });
      uploadMedia(f, named);
      continue;
    }
    if (!OK_EXT.test(name)) { toast(`${name}: ` + T('JSON·텍스트·이미지·영상 파일만 첨부할 수 있습니다', 'only JSON, text, image and video files can be attached'), true); continue; }
    if (file.size > MAX_FILE_BYTES) { toast(`${name}: ` + T('2MB 이하만 첨부할 수 있습니다', 'must be 2MB or smaller'), true); continue; }
    try { S.files.push({ name, size:file.size, kind:'text', content: await file.text() }); }
    catch { toast(`${name}: ` + T('파일을 읽지 못했습니다', 'could not read the file'), true); }
  }
  renderChips(); $('#q').focus();
}
$('#attachBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
(() => {
  const zone = document.querySelector('.composer'); let depth = 0;
  const has = e => [...(e.dataTransfer && e.dataTransfer.types || [])].includes('Files');
  zone.addEventListener('dragenter', e => { if (!has(e)) return; e.preventDefault(); depth++; zone.classList.add('drag'); });
  zone.addEventListener('dragover', e => { if (has(e)) e.preventDefault(); });
  zone.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) zone.classList.remove('drag'); });
  zone.addEventListener('drop', e => { if (!has(e)) return; e.preventDefault(); depth = 0; zone.classList.remove('drag'); addFiles(e.dataTransfer.files); });
  // 화면 다른 곳에 떨어뜨려도 브라우저가 파일을 열어버리지 않게
  window.addEventListener('dragover', e => { if (has(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (has(e)) { e.preventDefault(); if (!zone.contains(e.target)) addFiles(e.dataTransfer.files); } });
  // Ctrl+V: 캡처 이미지나 탐색기에서 복사한 파일을 붙여넣으면 첨부, 글자는 원래대로 붙여넣기
  document.addEventListener('paste', e => {
    const cd = e.clipboardData; if (!cd) return;
    let files = [...(cd.files || [])];
    if (!files.length) files = [...(cd.items || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
})();
function attUrl(att, path) {
  const p = String(path || '').replace(/\\/g, '/'), key = '/attachments/' + S.current + '/';
  const i = p.indexOf(key);
  return i < 0 ? '' : `/api/attachment?conversation_id=${encodeURIComponent(S.current)}&file=${encodeURIComponent(p.slice(i + key.length))}`;
}

// ---------- Council 자체 업데이트 (GitHub → 이 PC) ----------
function modal(title, body, buttons) {
  const m = el('div', 'modal'), box = el('div', 'box'); box.append(el('h3', '', title));
  if (body) box.append(typeof body === 'string' ? el('pre', '', body) : body);
  const row = el('div', 'row');
  (buttons || [{ label:T('닫기', 'Close') }]).forEach(b => { const btn = el('button', b.primary ? 'primary' : '', b.label);
    btn.onclick = () => { if (!b.keep) m.remove(); b.onClick && b.onClick(); }; row.append(btn); });
  box.append(row); m.append(box); m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.append(m); return m;
}
// Council 자체 업데이트: GPT·Claude 버전처럼 평소에는 버전만, 새 버전이 있을 때만 노란 "⬆ 업데이트하기"
async function checkUpdate(force, quiet) {
  let r; try { r = await api('/api/update/check' + (force ? '?refresh=1' : '')); }
  catch (e) { if (!quiet) toast(T('업데이트 확인 실패: ', 'Update check failed: ') + e.message, true); return; }
  const n = $('#upNew'), err = $('#upErr');
  n.hidden = err.hidden = true;
  if (r.status === 'available') {
    n.hidden = false; n.textContent = T(`⬆ ${r.remote ? 'V' + r.remote + ' ' : ''}업데이트하기`, `⬆ Update${r.remote ? ' to V' + r.remote : ''}`);
    n.title = T(`현재 V${r.running} → 새 V${r.remote || '?'} · 누르면 변경 내역을 보고 업데이트합니다`, `Current V${r.running} → new V${r.remote || '?'} · click to see changes and update`);
    n.onclick = () => showUpdate(r);
    if (!quiet) showUpdate(r);
  } else if (r.status !== 'latest') {
    err.hidden = false; err.textContent = T('업데이트 확인 불가', 'Cannot check for updates'); err.title = r.message || '';
    err.onclick = () => modal(T('업데이트를 확인할 수 없습니다', 'Cannot check for updates'), r.message || '');
    if (!quiet) modal(T('업데이트를 확인할 수 없습니다', 'Cannot check for updates'), r.message || '');
  } else if (!quiet) toast(T(`Council V${r.running} · 최신 버전입니다`, `Council V${r.running} · up to date`));
}
function showUpdate(r) {
  const body = T(`현재 V${r.running} → 새 V${r.remote || '?'}  (변경 ${r.behind}개)\n\n`, `Current V${r.running} → new V${r.remote || '?'}  (${r.behind} change(s))\n\n`) +
    (r.commits && r.commits.length ? r.commits.map(c => '• ' + c).join('\n') : T('변경 내역 없음 (기록 정리만 필요)', 'No content changes (history cleanup only)')) +
    T('\n\n대화 기록(data/)은 그대로 유지됩니다. 업데이트 후 Council이 자동으로 다시 시작됩니다.', '\n\nYour chats (data/) are kept. Council restarts automatically after the update.');
  modal(T('Council 업데이트', 'Update Council'), body, [{ label:T('나중에', 'Later') }, { label:T('지금 업데이트', 'Update now'), primary:true, onClick: applyUpdate }]);
}
async function applyUpdate() {
  if (S.running) { toast(T('답변 생성 중에는 업데이트할 수 없습니다', 'Cannot update while an answer is being generated'), true); return; }
  const m = modal(T('업데이트 중…', 'Updating…'), T('GitHub에서 새 버전을 받는 중입니다.', 'Downloading the new version from GitHub.'), [{ label:T('닫기', 'Close'), keep:true }]);
  let r; try { r = await api('/api/update/apply', {}); }
  catch (e) { m.remove(); modal(T('업데이트를 멈췄습니다', 'Update stopped'), e.message); return; }
  if (!r.restarting) { m.remove(); modal(T('최신 버전입니다', 'Up to date'), T(`현재 V${r.version}`, `Current V${r.version}`)); $('#upNew').hidden = true; return; }
  m.querySelector('pre').textContent = T(`V${r.version} 받기 완료 (${r.from} → ${r.to}).\nCouncil을 다시 시작하는 중… 잠시 후 화면이 새로고침됩니다.`, `Downloaded V${r.version} (${r.from} → ${r.to}).\nRestarting Council… the page will refresh shortly.`);
  const started = Date.now();
  const poll = async () => {
    try { const s = await api('/api/status'); if (s.version === r.version) { location.reload(); return; } } catch {}
    if (Date.now() - started > 90000) { m.querySelector('pre').textContent = T('재시작 확인이 늦어지고 있습니다.\n1. 바탕화면의 AI Council을 다시 실행한 뒤 새로고침하세요.\n2. 그래도 그대로면 ', 'The restart is taking longer than expected.\n1. Run AI Council from the desktop again, then refresh.\n2. If nothing changes, ') + (S.platform === 'mac' ? T('활성 상태 보기(Activity Monitor)에서 Python 을 종료한 뒤 다시 실행하세요.', 'quit Python in Activity Monitor and run it again.') : T('작업 관리자 → 세부 정보에서 pythonw.exe 를 모두 끝낸 뒤 다시 실행하세요.', 'end every pythonw.exe in Task Manager → Details and run it again.')); return; }
    setTimeout(poll, 1500);
  };
  setTimeout(poll, 2500);
}
setInterval(() => { if (!S.running) checkUpdate(false, true); }, 30 * 60 * 1000);  // 켜 둔 동안 30분마다 조용히 확인

// ---------- 기타 ----------
$('#newBtn').onclick = () => newConversation().catch(e => toast(e.message, true));
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setScope(b.dataset.scope));
$('#search').addEventListener('input', () => { clearTimeout(S.searchTimer); S.searchTimer = setTimeout(() => doSearch().catch(e => toast(e.message, true)), 250); });
$('#menu').onclick = () => $('#app').classList.toggle('nav'); $('#scrim').onclick = () => $('#app').classList.remove('nav');
$('#quit').onclick = async () => { if (S.running && !confirm(T('답변 생성 중입니다. 그래도 종료할까요?', 'An answer is being generated. Quit anyway?'))) return;
  try { await fetch('/api/shutdown', { method:'POST', headers:{ 'X-Lang':LANG } }); } finally { document.body.innerHTML = '<div style="padding:40px;font:16px system-ui;color:var(--text);background:var(--bg);height:100vh">' + T('AI Council을 종료했습니다. 이 창을 닫아도 됩니다.', 'AI Council has quit. You can close this window.') + '</div>'; } };
window.addEventListener('beforeunload', e => { if (S.running) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { const id = (location.hash.match(/^#c=([\w-]+)/) || [])[1]; if (id && id !== S.current) openConversation(id).catch(() => {}); });

(async function init() {
  applyStaticLang(); setupLangButton(); setupNotifyButton();
  bindModel($('#gptModel'), $('#gptCustom'), 'councilGptModel');
  bindModel($('#claudeModel'), $('#claudeCustom'), 'councilClaudeModel');
  $('#workdir').value = store.get('councilWorkdir') || '';
  S.imgRatio = store.get('councilImgRatio') || 'square'; document.querySelectorAll('#imgOpts button').forEach(x => x.classList.toggle('on', x.dataset.r === S.imgRatio));
  $('#imgCount').value = store.get('councilImgCount') || '1';
  setMode('chat'); // 기본값은 항상 대화 모드

  setWeb(store.get('councilWeb') === '1');
  setMcp(store.get('councilMcp') === '1'); setMcpGpt(store.get('councilMcpGpt') === '1'); setExecutor(store.get('councilExecutor') || 'claude');
  setTarget(['gpt','claude','both'].includes(store.get('councilTarget')) ? store.get('councilTarget') : 'both');
  api('/api/status').then(s => { $('#ver').textContent = 'V' + s.version;
    if (s.version !== UI_VERSION) { const n = el('div', 'notice err', T(`서버(V${s.version})가 화면(V${UI_VERSION})보다 오래된 버전입니다. 바탕화면의 AI Council을 다시 실행하면 새 버전으로 바뀝니다.`, `The server (V${s.version}) is older than the page (V${UI_VERSION}). Run AI Council from the desktop again to switch to the new version.`)); $('#notices').before(n); }
    const mark = ok => ok ? '●' : '○'; $('#cli').textContent = `${mark(s.cli.codex)} Codex  ${mark(s.cli.claude)} Claude`;
    $('#cli').title = T('CLI 감지 여부 (PATH 기준)', 'CLI detected on PATH'); if (!s.cli.codex || !s.cli.claude) toast(T('일부 CLI를 찾지 못했습니다. PATH를 확인하세요.', 'Some CLIs were not found. Check your PATH.'), true);
    S.platform = s.platform; S.setup = s.setup; S.ffmpeg = s.ffmpeg; S.defaults = s.default_models; S.usage = s.usage; updateModelInfo();
    loadVersions(false);
    $('#appVer').querySelector('b').textContent = 'V' + s.version;
    checkUpdate(false, true);
  }).catch(() => { $('#cli').textContent = T('서버 연결 실패', 'Cannot reach the server'); });
  try {
    await loadList();
    const want = (location.hash.match(/^#c=([\w-]+)/) || [])[1] || store.get('councilConversation');
    const found = S.list.find(x => x.id === want);
    if (found) await openConversation(found.id);
    else { const first = S.list.find(x => !x.archived); if (first) await openConversation(first.id); else await newConversation(); }
  } catch (e) { toast(T('초기화 실패: ', 'Startup failed: ') + e.message, true); }
})();
